name: Deploy to Mooncakes

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Validate package before publish
        run: |
          moon fmt --check
          moon check
          moon test
          moon package

      - name: Configure Mooncakes token
        env:
          MOONBIT_TOKEN: ${{ secrets.MOONBIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon"
          printf '{"token":"%s"}\n' "$MOONBIT_TOKEN" > "$HOME/.moon/credentials.json"

      - name: Publish package
        run: moon publish
